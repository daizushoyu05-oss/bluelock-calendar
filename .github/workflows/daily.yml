name: daily-update

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日朝6時（日本時間）
  workflow_dispatch:        # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python bluelock.py
      - name: Save calendar file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bluelock.ics
          git diff --cached --quiet || git commit -m "update calendar"
          git push
