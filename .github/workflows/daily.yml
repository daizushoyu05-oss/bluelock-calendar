name: daily-update

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python bluelock.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save calendar file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bluelock.ics
          git diff --cached --quiet || git commit -m "update calendar"
          git push
